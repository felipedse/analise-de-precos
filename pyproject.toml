[project]
name = "precos-sc"
version = "0.1.0"
description = "Coleta de preços de supermercados de Santa Catarina para um banco PostgreSQL local"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
precos = "precos.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
